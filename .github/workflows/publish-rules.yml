name: Publish Agent Rules (Latest)

on:
  push:
    branches:
      - main # Твоя основная ветка
    paths:
      - '.agent/**'
      - 'README.md'
      - '.github/workflows/publish-rules.yml'

permissions:
  contents: write

jobs:
  publish-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      # Тег двигается, а не пересоздаётся. Раньше здесь стояло
      # `git push origin :refs/tags/latest` - удаление тега, а GitHub при
      # потере тега превращает связанный релиз в черновик. Следующий прогон
      # создавал новый релиз, а прежний оставался висеть черновиком. Так
      # накопилось 27 штук с одним и тем же именем.
      - name: 🔄 Move the 'latest' tag
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git tag -f latest
          git push -f origin latest

      - name: 📊 Generate HEARTBEAT.md
        run: python3 .agent/scripts/generate_heartbeat.py --output .agent/HEARTBEAT.md

      - name: 🚀 Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Создать релиз, только если его ещё нет; иначе обновить заметки.
          # `create ... || true` прятало и настоящие ошибки заодно.
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest \
              --title "Latest Agent Rules" \
              --notes "Автоматическое обновление правил: $(date -u)"
          else
            gh release create latest \
              --title "Latest Agent Rules" \
              --notes "Автоматическое обновление правил: $(date -u)" \
              --prerelease=false \
              --latest=true
          fi

          gh release upload latest scripts/install_github.py --clobber
